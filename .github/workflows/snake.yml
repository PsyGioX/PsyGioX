name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%23f8b4d0&color_dots=%232a2438,%23cdb4f6,%23f8b4d0,%23b5ead7,%23ffe3a8
            dist/snake-light.svg?palette=github-light&color_snake=%238e6bbf&color_dots=%23efe6fb,%23e0cdf6,%23f8b4d0,%23b5ead7,%23ffd98a

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
